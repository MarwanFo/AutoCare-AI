# Spring Application Name
spring.application.name=backend

# Active Environment Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Datasource Configuration
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autocare}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5432/autocare
spring.datasource.username=postgres
spring.datasource.password=FARIDIfo22@

# JPA & Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.seed-dev-admin=${SEED_DEV_ADMIN:false}

# SMTP Mail Server Configurations
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security JWT Configurations
app.security.jwt.secret=${JWT_SECRET:dGhlLXNlY3JldC1rZXktZm9yLWF1dG9jYXJlLWFpLXByb2R1Y3Rpb24tc2VjdXJpdHktMTIzNDU2Nzg5MA==}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Gemini API Integration
gemini.api.key=${GEMINI_API_KEY:}

# Cloudinary Integration (Ready for Media Storage)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
