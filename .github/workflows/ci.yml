name: AutoCare-AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Security & Secret Leak Prevention Guard
  # ----------------------------------------------------------------------------
  secret-guard:
    name: Security & Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no real .env files are tracked
        run: |
          echo "Scanning for tracked .env files..."
          bad_files=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -Ev '\.env\.example$|\.env\.docker\.example$' || true)
          if [ -n "$bad_files" ]; then
            echo "::error::Tracked secret files detected in Git repository:"
            echo "$bad_files"
            exit 1
          fi
          echo "Secret scan passed cleanly. No .env leak found."

  # ----------------------------------------------------------------------------
  # Job 2: Spring Boot Backend CI (Java 21 / Maven / JUnit 5)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Spring Boot 3 / Java 21)
    runs-on: ubuntu-latest
    needs: [secret-guard]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven Wrapper
        run: mvn -version

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Start and Configure PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h 127.0.0.1 -p 5432; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "DROP DATABASE IF EXISTS autocare;"
          sudo -u postgres psql -c "CREATE DATABASE autocare;"

      - name: Run Unit & Integration Tests (JUnit 5)
        run: ./mvnw test -B
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://127.0.0.1:5432/autocare
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          JWT_EXPIRATION_MS: 900000
          SEED_DEV_ADMIN: "true"
          GEMINI_API_KEY: dummy_gemini_api_key_for_ci
          MAIL_USERNAME: ""
          MAIL_PASSWORD: ""

      - name: Print Surefire Reports on Failure
        if: failure()
        run: |
          echo "==================== SUREFIRE TEST REPORTS ===================="
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "-------------------- $f --------------------"
              cat "$f"
            fi
          done
          echo "==================== SUREFIRE XML (errors only) ===================="
          grep -l "errors=\"[^0]\"" target/surefire-reports/*.xml 2>/dev/null | while read xf; do
            echo "--- $xf ---"
            grep -A5 "<error" "$xf" | head -60
          done

      - name: Build Production JAR Package
        run: ./mvnw package -DskipTests -B

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 3: Admin Web Dashboard CI (React 19 / Vite / TailwindCSS)
  # ----------------------------------------------------------------------------
  admin-ci:
    name: Admin Web CI (React / Vite)
    runs-on: ubuntu-latest
    needs: [secret-guard]
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (ESLint)
        run: npm run lint || true

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Upload Admin Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 4: Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, admin-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: autocare/backend:ci-test

      - name: Build Admin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: false
          tags: autocare/admin:ci-test

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
